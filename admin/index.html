<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Connexion - VetCare</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-login-page">
    <div class="admin-login-container">
        <div class="admin-login-box">
            <div class="admin-login__header">
                <svg width="50" height="50" viewBox="0 0 40 40" fill="none">
                    <circle cx="20" cy="20" r="18" stroke="#0c8b86" stroke-width="2"/>
                    <path d="M20 8V32M8 20H32" stroke="#0c8b86" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <h1>VetCare Admin</h1>
            </div>

            <form class="admin-login-form" id="admin-login-form">
                <div class="form-group">
                    <label class="form-label" for="admin-email">Email</label>
                    <input class="form-input" type="email" id="admin-email" name="email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="admin-password">Mot de passe</label>
                    <input class="form-input" type="password" id="admin-password" name="password" required>
                </div>

                <button type="submit" class="btn btn--teal btn--large btn--full">Se Connecter</button>
            </form>

            <div class="admin-login-footer">
                <p>Accès réservé aux administrateurs</p>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="js/admin-login.js"></script>
</body>
</html>
